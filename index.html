<style>
/* Base */
.map-widget { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
.map-widget * { box-sizing: border-box; }
.map-wrap { position: relative; max-width: 900px; margin: 1rem auto; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.12); }
.map-wrap img { display:block; width:100%; height:auto; pointer-events:none; }
.hotspot {
  position:absolute; z-index:2;
  border:1px solid rgba(26,115,232,.42);
  outline:none;
  background:rgba(26,115,232,.045);
  border-radius:6px;
  cursor:pointer;
  transition:background .12s ease, border-color .12s ease, box-shadow .12s ease;
  padding:0; appearance:none; -webkit-appearance:none;
}
.hotspot:hover {
  background:rgba(26,115,232,.13);
  border-color:rgba(26,115,232,.75);
  box-shadow:0 2px 8px rgba(0,0,0,.14);
}
.hotspot:focus-visible {
  outline:2px solid #1a73e8;
  outline-offset:2px;
  background:rgba(26,115,232,.13);
}
.modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:9999; padding:1rem; }
.modal-backdrop.show { display:flex; }
.modal { width:min(920px,95vw); background:#fff; border-radius:16px; box-shadow:0 14px 50px rgba(0,0,0,.35); overflow:hidden; max-height:90vh; display:grid; grid-template-rows:auto 1fr auto; }
.modal header { padding:16px 20px; border-bottom:1px solid #eee; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.modal header h3 { margin:0; font-size:18px; }
.badge { font-size:12px; background:#eef2ff; color:#3730a3; padding:2px 8px; border-radius:999px; }
.modal .content { padding:16px 20px; overflow:auto; }
.modal .content .today { background:#f8fafc; border:1px solid #e5e7eb; padding:12px; border-radius:12px; margin-bottom:14px; }
.table { width:100%; border-collapse:collapse; font-size:14px; }
.table th, .table td { padding:8px 10px; border-bottom:1px solid #eee; text-align:left; vertical-align:top; }
.table th { background:#fafafa; position:sticky; top:0; }
.legend { display:flex; gap:12px; align-items:center; font-size:12px; margin:10px 0 2px; flex-wrap:wrap; }
.swatch { width:10px; height:10px; border-radius:2px; display:inline-block; margin-right:6px; }
.swatch.busy { background:#fca5a5; }
.swatch.free { background:#86efac; }
.modal footer { padding:12px 20px; border-top:1px solid #eee; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.modal footer .btn { background:#1a73e8; color:#fff; padding:10px 14px; border:0; border-radius:10px; cursor:pointer; }
.modal footer .btn.secondary { background:#f1f5f9; color:#0f172a; }
.small { color:#64748b; font-size:12px; }
.note { color:#64748b; font-size:12px; margin-top:3px; }
@media (max-width:700px) {
  .modal { width:97vw; }
  .modal .content { padding:12px; }
  .table { font-size:12px; }
  .table th, .table td { padding:7px 6px; }
}
</style>

const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

function toMinutes(t){
  if(!t) return null;
  const [H,M] = String(t).split(":").map(Number);
  return H*60+M;
}
function fromMinutes(m){
  const h=String(Math.floor(m/60)).padStart(2,"0");
  const mm=String(m%60).padStart(2,"0");
  return `${h}:${mm}`;
}
function humanRange([s,e]){ return `${fromMinutes(s)}–${fromMinutes(e)}`; }

function parseDate(s){
  if(!s) return null;
  const [m,d,y] = String(s).split("/").map(Number);
  return new Date(y, m-1, d);
}
function formatDate(s){
  const d=parseDate(s);
  if(!d) return "";
  return d.toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
}
function dateRange(e){
  if(e.dateLabel) return e.dateLabel;
  if(!e.startDate && !e.endDate) return "";
  if(e.startDate === e.endDate) return formatDate(e.startDate);
  return `${formatDate(e.startDate)}–${formatDate(e.endDate)}`;
}
function eventTimeLabel(e){
  if(e.timeLabel) return e.timeLabel;
  if(e.start && e.end) return `${e.start}–${e.end}`;
  if(e.start) return `${e.start} start`;
  return "";
}
function dayForDate(date){ return DAYS[(date.getDay()+6)%7]; }
function dateOnly(date){ return new Date(date.getFullYear(),date.getMonth(),date.getDate()); }
function inDateRange(date,startDate,endDate){
  const d=dateOnly(date), s=parseDate(startDate), e=parseDate(endDate);
  if(s && d<s) return false;
  if(e && d>e) return false;
  return true;
}
function isActiveOnDate(e,date){
  return e.day === dayForDate(date) && inDateRange(date,e.startDate,e.endDate);
}
function sortEvents(a,b){
  const dayDiff=DAYS.indexOf(a.day)-DAYS.indexOf(b.day);
  if(dayDiff) return dayDiff;
  const startDiff=(toMinutes(a.start) ?? 9999)-(toMinutes(b.start) ?? 9999);
  if(startDiff) return startDiff;
  return String(a.program||"").localeCompare(String(b.program||""));
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

function computeAvailability(dayEvents, open=OPEN_TIME, close=CLOSE_TIME){
  const start=toMinutes(open), end=toMinutes(close);
  const busy=[];
  let hasOpenEnded=false;

  for(const e of dayEvents.slice().sort((a,b)=>(toMinutes(a.start)??9999)-(toMinutes(b.start)??9999))){
    const s0=toMinutes(e.start);
    if(s0==null) continue;
    const e0=toMinutes(e.end);
    if(e0==null) hasOpenEnded=true;
    const s=Math.max(s0,start);
    const ee=Math.min(e0==null ? end : e0,end);
    if(ee<=s) continue;
    if(!busy.length || s>busy[busy.length-1][1]) busy.push([s,ee]);
    else busy[busy.length-1][1]=Math.max(busy[busy.length-1][1],ee);
  }

  const free=[];
  let cursor=start;
  for(const [s,e] of busy){
    if(s>cursor) free.push([cursor,s]);
    cursor=Math.max(cursor,e);
  }
  if(cursor<end) free.push([cursor,end]);
  return {busy,free,hasOpenEnded};
}

function openRoom(room){
  const {backdrop,titleEl,openBadge,todaySummary,tableBody,dlBtn} = window.__mapEls;
  const data=(schedules[room]||[]).slice().sort(sortEvents);

  titleEl.textContent=`${room} – 2026–27 Schedule`;
  tableBody.innerHTML="";

  if(!data.length){
    const tr=document.createElement("tr");
    tr.innerHTML=`<td colspan="6">No bookings are listed for this space.</td>`;
    tableBody.appendChild(tr);
  } else {
    for(const e of data){
      const tr=document.createElement("tr");
      const note=e.notes ? `<div class="note">${escapeHtml(e.notes)}</div>` : "";
      tr.innerHTML =
        `<td>${escapeHtml(dateRange(e))}</td>`+
        `<td>${escapeHtml(e.day)}</td>`+
        `<td><span class="swatch busy"></span>${escapeHtml(eventTimeLabel(e))}</td>`+
        `<td>${escapeHtml(e.program)}</td>`+
        `<td>${escapeHtml(e.title)}${note}</td>`+
        `<td>${escapeHtml(e.instructor||"")}</td>`;
      tableBody.appendChild(tr);
    }
  }

  const now=new Date();
  const activeToday=data.filter(e=>isActiveOnDate(e,now));
  const today=dayForDate(now);
  const todayDate=now.toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"});
  const withinMaster=inDateRange(now,MASTER_START,MASTER_END);

  if(activeToday.length){
    const {busy,free,hasOpenEnded}=computeAvailability(activeToday);
    const nowMin=now.getHours()*60+now.getMinutes();
    const isBusy=busy.some(([s,e])=>nowMin>=s && nowMin<e);
    const bookingText=activeToday.map(e=>`${escapeHtml(eventTimeLabel(e))} ${escapeHtml(e.title)}`).join("; ");

    todaySummary.innerHTML =
      `<strong>${today}, ${todayDate}:</strong> ${isBusy ? "Scheduled use right now." : "No listed booking at this moment."}<br>`+
      `<span class="small">Today's bookings: ${bookingText}`+
      `${free.length ? `. Free blocks: ${free.map(humanRange).join(", ")}.` : ""}`+
      `${hasOpenEnded ? " One or more evening blocks list a start time only, so later availability may be uncertain." : ""}`+
      ` Recurring weekly blocks may be superseded by closures, breaks, intensives, or special events.</span>`;

    openBadge.textContent=isBusy ? "BUSY" : "OPEN";
    openBadge.style.background=isBusy ? "#fff7ed" : "#ecfdf5";
    openBadge.style.color=isBusy ? "#9a3412" : "#065f46";
  } else if(!withinMaster){
    const start=parseDate(MASTER_START), end=parseDate(MASTER_END);
    const before=dateOnly(now)<start;
    todaySummary.innerHTML =
      `<strong>${today}, ${todayDate}:</strong> No 2026–27 weekly schedule is active today.<br>`+
      `<span class="small">${before ? `The master schedule begins ${formatDate(MASTER_START)}.` : `The master schedule runs through ${formatDate(MASTER_END)}.`}</span>`;
    openBadge.textContent="OUT OF TERM";
    openBadge.style.background="#f1f5f9";
    openBadge.style.color="#475569";
  } else {
    const {free}=computeAvailability([]);
    todaySummary.innerHTML =
      `<strong>${today}, ${todayDate}:</strong> No booking is listed for this studio today.<br>`+
      `<span class="small">Open-hours window used by this tool: ${OPEN_TIME}–${CLOSE_TIME}. Free blocks: ${free.map(humanRange).join(", ")}. Recurring weekly blocks may be superseded by closures, breaks, intensives, or special events.</span>`;
    openBadge.textContent="OPEN";
    openBadge.style.background="#ecfdf5";
    openBadge.style.color="#065f46";
  }

  dlBtn.onclick=()=>downloadICS(room,data);
  backdrop.classList.add("show");
  backdrop.setAttribute("aria-hidden","false");
}

function csvToRows(csv){
  const rows=[]; let row=[], val="", inQuotes=false;
  for(let i=0;i<csv.length;i++){
    const c=csv[i], n=csv[i+1];
    if(c==='"' && inQuotes && n==='"'){ val+='"'; i++; }
    else if(c==='"') inQuotes=!inQuotes;
    else if(c===',' && !inQuotes){ row.push(val); val=""; }
    else if((c==='\n' || c==='\r') && !inQuotes){
      if(c==='\r' && n==='\n') i++;
      row.push(val); val="";
      if(row.some(x=>x.trim()!=="")) rows.push(row);
      row=[];
    } else val+=c;
  }
  row.push(val);
  if(row.some(x=>x.trim()!=="")) rows.push(row);
  return rows;
}

async function loadScheduleCSV(){
  try {
    const response=await fetch(DATA_CSV_URL,{cache:"no-store"});
    if(!response.ok) throw new Error("CSV unavailable");
    const rows=csvToRows(await response.text());
    const headers=rows.shift().map(h=>h.replace(/^\uFEFF/,"").trim());
    const next={};

    for(const r of rows){
      const rec=Object.fromEntries(headers.map((h,i)=>[h,(r[i]||"").trim()]));
      const room=rec.Room;
      if(!room) continue;
      next[room] ||= [];
      next[room].push({
        program:rec.Program,
        title:rec.Title,
        day:rec.Day,
        start:rec["Start Time"],
        end:rec["End Time"],
        timeLabel:rec["Time Label"],
        startDate:rec["Start Date"],
        endDate:rec["End Date"],
        dateLabel:rec["Date Label"],
        instructor:rec.Instructor,
        notes:rec.Notes
      });
    }
    for(const room in next) next[room].sort(sortEvents);
    schedules=next;
  } catch(err) {
    console.info("Using embedded 2026–27 schedule data because the CSV was not loaded.",err);
  }
}

function ymdLocal(d){
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
}
function dateForDayInRange(startDate,endDate,day){
  const start=parseDate(startDate), end=parseDate(endDate);
  if(!start||!end) return [];
  const target=DAYS.indexOf(day), dates=[], cur=new Date(start);
  while(cur<=end){
    if(dayForDate(cur)===day) dates.push(new Date(cur));
    cur.setDate(cur.getDate()+1);
  }
  return dates;
}
function icsEscape(s){
  return String(s??"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
}
function downloadICS(room,data){
  const TZ="America/New_York";
  let ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Lyme Academy//2026-27 Interactive Map//EN\r\nX-WR-TIMEZONE:"+TZ+"\r\n";

  for(const e of data){
    for(const d of dateForDayInRange(e.startDate,e.endDate,e.day)){
      const uid=`${room}-${e.title}-${e.day}-${e.startDate}-${ymdLocal(d)}@lyme`.replace(/[^a-zA-Z0-9@.-]/g,"");
      ics+="BEGIN:VEVENT\r\n";
      ics+=`UID:${uid}\r\n`;
      ics+=`DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").split(".")[0]}Z\r\n`;
      ics+=`DTSTART;TZID=${TZ}:${ymdLocal(d)}T${e.start.replace(":","")}00\r\n`;
      if(e.end) ics+=`DTEND;TZID=${TZ}:${ymdLocal(d)}T${e.end.replace(":","")}00\r\n`;
      ics+=`SUMMARY:${icsEscape(room+" – "+e.title)}\r\n`;
      ics+=`DESCRIPTION:${icsEscape([e.program,e.instructor,e.notes].filter(Boolean).join(" | "))}\r\n`;
      ics+="END:VEVENT\r\n";
    }
  }

  ics+="END:VCALENDAR\r\n";
  const blob=new Blob([ics],{type:"text/calendar"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`${room.replace(/\s+/g,"_")}_2026_27.ics`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}

document.addEventListener("DOMContentLoaded",async()=>{
  await loadScheduleCSV();

  const backdrop=document.getElementById("modalBackdrop");
  const titleEl=document.getElementById("modalTitle");
  const openBadge=document.getElementById("openBadge");
  const todaySummary=document.getElementById("todaySummary");
  const tableBody=document.querySelector("#scheduleTable tbody");
  const closeBtn=document.getElementById("closeBtn");
  const dlBtn=document.getElementById("downloadICS");

  window.__mapEls={backdrop,titleEl,openBadge,todaySummary,tableBody,closeBtn,dlBtn};

  document.querySelectorAll(".hotspot").forEach(hs=>{
    hs.addEventListener("click",()=>openRoom(hs.dataset.room));
  });

  function closeModal(){
    backdrop.classList.remove("show");
    backdrop.setAttribute("aria-hidden","true");
  }
  closeBtn.addEventListener("click",closeModal);
  backdrop.addEventListener("click",e=>{ if(e.target===backdrop) closeModal(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape" && backdrop.classList.contains("show")) closeModal(); });
});
