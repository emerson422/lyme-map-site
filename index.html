/* Base */
.map-widget { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

.map-wrap { position: relative; max-width: 900px; margin: 1rem auto; border-radius: 12px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.12); }
.map-wrap img { display:block; width:100%; height:auto; pointer-events:none; }
.hotspot { position: absolute; z-index: 2; border: 2px solid rgba(255,255,255,.95); outline: 2px dashed rgba(0,0,0,.25); background: rgba(26,115,232,.08); border-radius: 8px; cursor: pointer; transition: transform .06s ease-in-out, box-shadow .1s; }
.hotspot:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.18); }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 9999; padding: 1rem; }
.modal-backdrop.show { display: flex; }
.modal { width: min(820px,95vw); background: #fff; border-radius: 16px; box-shadow: 0 14px 50px rgba(0,0,0,.35); overflow: hidden; max-height: 90vh; display: grid; grid-template-rows: auto 1fr auto; }
.modal header { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.modal header h3 { margin: 0; font-size: 18px; }
.badge { font-size: 12px; background: #eef2ff; color: #3730a3; padding: 2px 8px; border-radius: 999px; }
.modal .content { padding: 16px 20px; overflow: auto; }
.modal .content .today { background: #f8fafc; border: 1px solid #e5e7eb; padding: 12px; border-radius: 12px; margin-bottom: 14px; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th, .table td { padding: 8px 10px; border-bottom: 1px solid #eee; text-align: left; vertical-align: top; }
.table th { background: #fafafa; position: sticky; top: 0; }
.legend { display: flex; gap: 12px; align-items: center; font-size: 12px; margin: 10px 0 2px; }
.swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 6px; }
.swatch.busy { background: #fca5a5; }
.swatch.free { background: #86efac; }
.modal footer { padding: 12px 20px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.modal footer .btn { background: #1a73e8; color: #fff; padding: 10px 14px; border: 0; border-radius: 10px; cursor: pointer; }
.modal footer .btn.secondary { background: #f1f5f9; color: #0f172a; }
.small { color: #64748b; font-size: 12px; }
.map-widget .hotspot .label { display: none !important; }

const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function toMinutes(t){ const [H,M]=String(t).split(":").map(Number); return H*60+M; }
function fromMinutes(m){ const h=String(Math.floor(m/60)).padStart(2,"0"); const mm=String(m%60).padStart(2,"0"); return `${h}:${mm}`; }
function humanRange([s,e]){ return `${fromMinutes(s)}–${fromMinutes(e)}`; }
function parseDate(s){ if(!s) return null; const [m,d,y]=String(s).split("/").map(Number); return new Date(y, m-1, d); }
function sameOrAfter(a,b){ return a.setHours(0,0,0,0) >= b.setHours(0,0,0,0); }
function sameOrBefore(a,b){ return a.setHours(0,0,0,0) <= b.setHours(0,0,0,0); }
function formatDate(s){ const d=parseDate(s); if(!d) return ""; return d.toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"}); }
function dateRange(e){ return e.startDate === e.endDate ? formatDate(e.startDate) : `${formatDate(e.startDate)}–${formatDate(e.endDate)}`; }
function sortEvents(a,b){
  const ad=parseDate(a.startDate), bd=parseDate(b.startDate);
  if(ad && bd && ad-bd) return ad-bd;
  if(a.day!==b.day) return DAYS.indexOf(a.day)-DAYS.indexOf(b.day);
  return toMinutes(a.start)-toMinutes(b.start);
}
function escapeHtml(s){ return String(s ?? "").replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function computeAvailability(dayEvents, open="08:00", close="22:00"){
  const start=toMinutes(open), end=toMinutes(close);
  const busy=[];
  for(const e of dayEvents.slice().sort((a,b)=>toMinutes(a.start)-toMinutes(b.start))){
    const s=Math.max(toMinutes(e.start),start), ee=Math.min(toMinutes(e.end),end);
    if(ee<=s) continue;
    if(!busy.length || s>busy[busy.length-1][1]) busy.push([s,ee]); else busy[busy.length-1][1]=Math.max(busy[busy.length-1][1],ee);
  }
  const free=[]; let cursor=start;
  for(const [s,e] of busy){ if(s>cursor) free.push([cursor,s]); cursor=Math.max(cursor,e); }
  if(cursor<end) free.push([cursor,end]);
  return {busy, free};
}
function isActiveOnDate(e, date){
  const start=parseDate(e.startDate), end=parseDate(e.endDate);
  if(!start || !end) return false;
  const copy=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  return sameOrAfter(new Date(copy), start) && sameOrBefore(new Date(copy), end) && e.day === DAYS[(date.getDay()+6)%7];
}
function openRoom(room){
  const { backdrop, titleEl, openBadge, todaySummary, tableBody, dlBtn } = window.__mapEls;
  const data = (schedules[room]||[]).slice().sort(sortEvents);
  titleEl.textContent = `${room} – Summer 2026 Schedule`;
  tableBody.innerHTML = "";
  if(!data.length){
    const tr=document.createElement("tr");
    tr.innerHTML = `<td colspan="5">No Summer 2026 CE, Workshop, or Youth bookings are listed for this space.</td>`;
    tableBody.appendChild(tr);
  } else {
    for(const e of data){
      const tr=document.createElement("tr");
      tr.innerHTML = `<td>${escapeHtml(dateRange(e))}</td><td>${escapeHtml(e.day)}</td><td><span class="swatch busy"></span>${escapeHtml(e.start)}–${escapeHtml(e.end)}</td><td>${escapeHtml(e.program)}</td><td>${escapeHtml(e.title)}</td>`;
      tableBody.appendChild(tr);
    }
  }
  const now = new Date();
  const activeToday = data.filter(e => isActiveOnDate(e, now));
  const {busy, free} = computeAvailability(activeToday);
  const nowMin = now.getHours()*60 + now.getMinutes();
  const isBusy = busy.some(([s,e]) => nowMin>=s && nowMin<e);
  const today = DAYS[(now.getDay()+6)%7];
  const todayDate = now.toLocaleDateString(undefined, {month:"long", day:"numeric", year:"numeric"});
  if(activeToday.length){
    todaySummary.innerHTML = `<strong>${today}, ${todayDate}:</strong> ${isBusy ? "In use right now" : "Open time right now"}.<br>` +
      `<span class="small">Today's bookings: ${activeToday.map(e => `${escapeHtml(e.start)}–${escapeHtml(e.end)} ${escapeHtml(e.title)}`).join("; ")}. Free blocks: ${free.length ? free.map(humanRange).join(", ") : "None"}.</span>`;
  } else {
    todaySummary.innerHTML = `<strong>${today}, ${todayDate}:</strong> No Summer 2026 bookings listed for today.<br><span class="small">Open hours 08:00–22:00. Free blocks: 08:00–22:00.</span>`;
  }
  openBadge.textContent = isBusy ? "BUSY" : "OPEN";
  openBadge.style.background = isBusy ? "#fff7ed" : "#ecfdf5";
  openBadge.style.color = isBusy ? "#9a3412" : "#065f46";
  dlBtn.onclick = () => downloadICS(room, data);
  backdrop.classList.add("show");
}
function csvToRows(csv){
  const rows=[]; let row=[], val='', inQuotes=false;
  for(let i=0;i<csv.length;i++){
    const c=csv[i], n=csv[i+1];
    if(c==='"' && inQuotes && n==='"'){ val+='"'; i++; }
    else if(c==='"') inQuotes=!inQuotes;
    else if(c===',' && !inQuotes){ row.push(val); val=''; }
    else if((c==='\n' || c==='\r') && !inQuotes){
      if(c==='\r' && n==='\n') i++;
      row.push(val); val='';
      if(row.some(x=>x.trim()!=='')) rows.push(row);
      row=[];
    } else val+=c;
  }
  row.push(val); if(row.some(x=>x.trim()!=='')) rows.push(row);
  return rows;
}
async function loadScheduleCSV(){
  try {
    const response = await fetch(DATA_CSV_URL, {cache: "no-store"});
    if(!response.ok) throw new Error("CSV unavailable");
    const rows = csvToRows(await response.text());
    const headers = rows.shift().map(h => h.trim());
    const next = {};
    for(const r of rows){
      const rec = Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()]));
      const room = rec.Room;
      if(!room) continue;
      next[room] ||= [];
      next[room].push({program:rec.Program,title:rec.Title,day:rec.Day,start:rec["Start Time"],end:rec["End Time"],startDate:rec["Start Date"],endDate:rec["End Date"]});
    }
    for(const room in next) next[room].sort(sortEvents);
    schedules = next;
  } catch(err) {
    console.info("Using embedded Summer 2026 schedule data because CSV was not loaded.", err);
  }
}
function ymdLocal(d){ return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }
function dateForDayInRange(startDate, endDate, day){
  const start=parseDate(startDate), end=parseDate(endDate); if(!start||!end) return [];
  const target=DAYS.indexOf(day); const dates=[]; const cur=new Date(start);
  while(cur<=end){ if(((cur.getDay()+6)%7)===target) dates.push(new Date(cur)); cur.setDate(cur.getDate()+1); }
  return dates;
}
function downloadICS(room, data){
  const TZ="America/New_York";
  let ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Lyme Academy//Summer 2026 Interactive Map//EN\r\nX-WR-TIMEZONE:"+TZ+"\r\n";
  for(const e of data){
    for(const d of dateForDayInRange(e.startDate,e.endDate,e.day)){
      const uid = `${room}-${e.title}-${e.day}-${e.startDate}-${Math.random().toString(36).slice(2)}@lyme`.replace(/[^a-zA-Z0-9@.-]/g,'');
      ics += "BEGIN:VEVENT\r\n";
      ics += `UID:${uid}\r\n`;
      ics += `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').split('.')[0]}Z\r\n`;
      ics += `DTSTART;TZID=${TZ}:${ymdLocal(d)}T${e.start.replace(':','')}00\r\n`;
      ics += `DTEND;TZID=${TZ}:${ymdLocal(d)}T${e.end.replace(':','')}00\r\n`;
      ics += `SUMMARY:${room} – ${e.title}\r\n`;
      ics += `DESCRIPTION:${e.program}; Summer 2026\r\n`;
      ics += "END:VEVENT\r\n";
    }
  }
  ics += "END:VCALENDAR\r\n";
  const blob = new Blob([ics], {type: "text/calendar"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `${room.replace(/\s+/g,'_')}_summer_2026.ics`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000);
}
document.addEventListener("DOMContentLoaded", async () => {
  await loadScheduleCSV();
  const backdrop = document.getElementById("modalBackdrop");
  const titleEl = document.getElementById("modalTitle");
  const openBadge = document.getElementById("openBadge");
  const todaySummary = document.getElementById("todaySummary");
  const tableBody = document.querySelector("#scheduleTable tbody");
  const closeBtn = document.getElementById("closeBtn");
  const dlBtn = document.getElementById("downloadICS");
  window.__mapEls = { backdrop, titleEl, openBadge, todaySummary, tableBody, closeBtn, dlBtn };
  document.querySelectorAll(".hotspot").forEach(hs => hs.addEventListener("click", () => openRoom(hs.dataset.room)));
  closeBtn.addEventListener("click", () => backdrop.classList.remove("show"));
  backdrop.addEventListener("click", e => { if(e.target === backdrop) backdrop.classList.remove("show"); });
});
